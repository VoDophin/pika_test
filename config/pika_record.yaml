# Pika 单独数据采集（无机械臂/Piper）配置。
# robot 使用 uf::mock_robot：不连接任何真实机械臂，把 Pika 的动作回显为观测，
# 只记录 Pika 遥操作 + 相机画面，产出 LeRobot 标准数据集。
# 采集出的数据可直接用于后续训练：lerobot-train --policy.type=act / diffusion。
robot:
  type: uf::mock_robot
  id: "uf_mock_robot"
  control_space: "cartesian"
  gripper_type: 2
  state_offset_action: 3
  teleop_id: "pika_pick"
  cameras:
    fisheye:  # 手部视角（Pika 鱼眼，跟着手动的相机）
      type: opencv
      # 改成你实际相机的节点路径；可用 lerobot-find-cameras opencv 查看。
      index_or_path: "/dev/v4l/by-id/usb-DECXIN_CAMERA_DECXIN_CAMERA_01.00.00-video-index0"
      width: 640
      height: 480
      fps: 30
      fourcc: "MJPG"
    third_person:  # 固定第三视角（不动、覆盖桌面的彩色相机）
      type: opencv
      # 实测为扩展坞彩色相机；用 by-id 更稳，若重启后节点变化需改这里
      index_or_path: "/dev/video0"
      width: 640
      height: 480
      fps: 30

teleop:
  type: uf::pika_teleop
  id: "pika_pick"
  # 改成实际 Pika Sense 串口（如 /dev/ttyUSB0）；可用 ls /dev/ttyUSB* 查看。
  port: "/dev/ttyUSB0"
  # 显式指定 Vive Tracker ID，跳过 SDK 设备列表自动检测（有竞态会漏检）
  tracker_device_id: "T20"
  frequency: 100
  use_gripper: true
  scale_xyz: 1.5
  tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
  robot_base_pose: [400, 0, 400, 180, 0, 0]

dataset:
  # 改成你有写权限的目录（当前用户是 star）；换机器/用户时按实际修改
  root: "/home/star/lerobot_data/pika_pick_bottle"
  repo_id: "local/pika_pick_bottle"
  single_task: "Pick up the glass bottle"
  fps: 30
  episode_time_s: 30
  reset_time_s: 10
  num_episodes: 30
  # LeRobot 0.4.3 合法编码: h264 / hevc / libsvtav1。
  # 用 h264：本机可正常解码（libsvtav1=AV1 在这台机器解不了）。
  vcodec: "h264"
  push_to_hub: false
